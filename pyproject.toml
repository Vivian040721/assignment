[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-paper-agent"
version = "0.1.0"
description = "Ten-person MCP paper research assignment scaffold"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
fulltext = ["pymupdf4llm"]
semantic = ["sentence-transformers"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
paper-agent = "paper_agent.cli:main"
paper-mcp = "paper_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_agent = ["fixtures/*.json", "fixtures/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
